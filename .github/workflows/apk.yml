name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :core:test :app:assembleRelease --no-daemon
      - name: Publish "latest" release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RepWise.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RepWise.apk --title "RepWise (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, tap RepWise.apk to download, then open it to install."
